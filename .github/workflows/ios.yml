# - Push to main / pull request: unit tests on the simulator (unsigned).
# - Push a tag ios-X.Y.Z (must match MARKETING_VERSION in project.yml): archives the signed app
#   and uploads it to App Store Connect (TestFlight).
# - "Run workflow" (manual): archives only; tick "upload" to also send it to TestFlight.
# Every upload reaches the internal group automatically, and is then added to the external group
# "Testing" and sent to Beta App Review with the notes in AppStore/whatsnew/en-US.txt.
# Signing is automatic with the App Store Connect API key in
# APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_P8. The archive is signed with the existing
# Apple Development certificate from IOS_DEV_CERT_P12_BASE64 / IOS_DEV_CERT_PASSWORD, so runs do
# not create a new development certificate each time. The upload is re-signed with the
# cloud-managed distribution certificate. The build number is the workflow run number.
name: iOS

on:
  push:
    branches: [main]
    tags: ["ios-[0-9]*.*.*"]
    paths-ignore: ["Website/**", "screenshots/**", "**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    # Apple requires the iOS 27 SDK for App Store uploads, so both jobs use the Xcode 27 image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "^27.0"
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test \
            -project PDFoundry.xcodeproj \
            -scheme PDFoundry \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 18 Pro' \
            CODE_SIGNING_ALLOWED=NO

  archive:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#ios-}"
          app="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)"
          [ "$tag" = "$app" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $app"; exit 1; }

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "^27.0"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Development certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::IOS_DEV_CERT_P12_BASE64 is not set"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          p12="$RUNNER_TEMP/dev.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project PDFoundry.xcodeproj -scheme PDFoundry -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PDFoundry.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -40

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PDFoundry.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # TestFlight "What to Test" from AppStore/whatsnew/en-US.txt (waits for App Store Connect to
      # list the build), then the external group "Testing" + Beta App Review. A failure here leaves
      # the upload in place: finish the missing step in App Store Connect.
      - name: Send to external testers
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        continue-on-error: true
        timeout-minutes: 75
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          info="$RUNNER_TEMP/PDFoundry.xcarchive/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$info")
          build=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$info")
          python3 -m venv "$RUNNER_TEMP/notes-venv"
          "$RUNNER_TEMP/notes-venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/notes-venv/bin/python" scripts/testflight-notes.py "$version" "$build" AppStore/whatsnew/en-US.txt \
            || { echo "::warning::TestFlight notes or external testing not done; check the build in App Store Connect"; exit 1; }

      - name: Remove the API key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [ -z "$SIGNING_KEYCHAIN" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true
