name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["Website/**", "screenshots/**", "**.md"]
  pull_request:

jobs:
  test:
    # Apple requires the iOS 27 SDK for App Store uploads, so build on the Xcode 27 image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^27.0"
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test \
            -project PDFoundry.xcodeproj \
            -scheme PDFoundry \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
