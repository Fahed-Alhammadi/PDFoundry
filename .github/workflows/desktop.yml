# Desktop app (Electron: macOS, Windows, Linux). Runs when desktop/ changes.
#   - every push / pull request: type-check, unit tests, the app's self-test in a real window on all three systems,
#     and unsigned packages for all three
#   - tag desktop-X.Y.Z (must match desktop/package.json): macOS signed with the Developer ID certificate and
#     notarized, then the GitHub release titled vX.Y.Z with every package and the latest*.yml files the installed
#     apps update from (scripts/github-release.sh, desktop/src/main/updater.ts), plus update-signatures.json(.sig)
#     (scripts/sign-update.mjs): Windows and Linux apps install only updates listed in it.
# Release secrets live in the `desktop-release` environment, which only desktop-* tags may use. Only the mac job uses
# it, and only for a tag. Notarization uses the repository's App Store Connect API key.
# Windows and Linux packages are not code-signed.
name: Desktop

on:
  push:
    branches: [main]
    tags: ['desktop-[0-9]*'] # a release (path filters don't apply to tags)
    paths: &paths
      - 'desktop/**'
      - 'scripts/github-release.sh'
      - 'scripts/sign-update.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-desktop-${{ github.ref }}

# Read-only token by default; the release job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release tag matches the version in the files
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          [ "$GITHUB_REF_NAME" = "desktop-$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version $version in desktop/package.json."; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Type-check and unit tests
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop

      # The app's own checks, in a real window on this system.
      - name: Self-test
        working-directory: desktop
        run: |
          if [ "${{ matrix.target }}" = linux ]; then xvfb-run -a npm run selftest; else npm run selftest; fi

      - name: Build packages
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:${{ matrix.target }} -- --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  # macOS, after Windows and Linux: for a tag it runs in the desktop-release environment, signs and notarizes the
  # Mac packages, then signs the list of every package of the release for the in-app updater.
  mac:
    needs: [test, package]
    runs-on: macos-15
    environment: ${{ github.ref_type == 'tag' && 'desktop-release' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop

      - name: Self-test
        working-directory: desktop
        run: npm run selftest

      # Release builds only: the Developer ID certificate goes into a throwaway keychain for this run, with Apple's
      # intermediates so the chain to the root is complete. electron-builder then finds it by name.
      - name: Import signing certificate
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE_P12" ] || { echo "::error::The signing certificate secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$NAME" ] || { security find-identity -p codesigning "$KEYCHAIN"; echo "::error::No valid Developer ID Application identity"; exit 1; }
          echo "CSC_NAME=${NAME#Developer ID Application: }" >> "$GITHUB_ENV"

      - name: Build packages
        working-directory: desktop
        env:
          RELEASE: ${{ github.ref_type == 'tag' }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ "$RELEASE" = true ]; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" # for the notarize step below
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false # unsigned test build
          fi
          npm run dist:mac -- --publish never

      # Notarizing the .dmg also notarizes the app inside (Apple records every nested binary), which covers the .zip
      # used for updates too: it holds the same app as the .dmg of its architecture. Stapling is retried because
      # Apple publishes a new ticket with a delay.
      - name: Notarize
        if: github.ref_type == 'tag'
        working-directory: desktop/dist
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          for f in *.dmg; do
            xcrun notarytool submit "$f" --key "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait \
              | tee notarize.log
            grep -q 'status: Accepted' notarize.log || { echo "::error::Notarization of $f was not accepted"; exit 1; }
            for try in 1 2 3 4 5 6; do xcrun stapler staple "$f" && break; [ $try = 6 ] && exit 1; sleep 30; done
          done
          rm notarize.log
          # The apps in the .zip files are now notarized too (checked online, as Gatekeeper does for a download).
          for z in *.zip; do
            rm -rf check && mkdir check && ditto -x -k "$z" check
            spctl --assess --type execute -vv check/*.app
          done
          rm -rf check
          spctl --assess --type open --context context:primary-signature -vv *.dmg

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

      # update-signatures.json lists the SHA-512 of every package of the release (win + linux + the mac artifact just
      # uploaded); the apps check it before installing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref_type == 'tag'
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/signed
          merge-multiple: true
      - name: Sign the update list
        if: github.ref_type == 'tag'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          SIGNED: ${{ runner.temp }}/signed
        run: |
          node scripts/sign-update.mjs "$SIGNED" io.pdfoundry.desktop "${GITHUB_REF_NAME#desktop-}" desktop/src/main/updateSignature.ts
          mkdir -p "$RUNNER_TEMP/sig" && mv "$SIGNED"/update-signatures.json* "$RUNNER_TEMP/sig"/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: desktop-signatures
          path: ${{ runner.temp }}/sig/update-signatures.json*
          if-no-files-found: error

  release:
    needs: [package, mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags + history for the release notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: assets
        run: |
          ls -l assets
          scripts/github-release.sh "$GITHUB_REF_NAME"
