# - Push to main / pull request touching android/: builds the debug app and runs the PDF engine
#   tests on an emulator.
# - Tag android-X.Y.Z (must match versionName), or a manual run with "upload" ticked: builds the
#   signed bundle and uploads it to Google Play closed testing. Promote it to production by hand
#   in Play Console. Version code = 1 + this workflow's run number (code 1 was uploaded by hand).
# Release notes: android/whatsnew/whatsnew-en-US (max 500 characters; edit before each release).
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
# Variable (optional): PLAY_TRACK (default "alpha" = closed testing; "internal", "production").
name: Android

on:
  push:
    branches: [main]
    tags: ["android-[0-9]*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload this build to Google Play (closed testing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Engine tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest

  publish:
    needs: test
    if: github.ref_type == 'tag' || inputs.upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "android-$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed bundle
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::Signing secrets are not set."; exit 1; }
          echo "$KEYSTORE" | base64 -d > upload.keystore
          printf 'storeFile=upload.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > keystore.properties
          ./gradlew :app:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "PDFoundry-${{ steps.v.outputs.version }}-${{ steps.v.outputs.code }}.aab"
          rm -f upload.keystore keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: |
            android/PDFoundry-*.aab
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.pdfoundry.app
          releaseFiles: android/PDFoundry-*.aab
          releaseName: ${{ steps.v.outputs.version }} (${{ steps.v.outputs.code }})
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: android/whatsnew
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: completed
